name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: Fig-Backup-macOS
            venv_python: .venv/bin/python
          - os: windows-2022
            artifact: Fig-Backup-Windows-x64
            venv_python: .venv/Scripts/python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m venv .venv
          ${{ matrix.venv_python }} -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm ci --no-audit --no-fund
      - name: Run tests
        run: |
          ${{ matrix.venv_python }} -m unittest discover -s tests
          npm run test:node
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: ./build-mac.sh
      - name: Build Windows app
        if: runner.os == 'Windows'
        run: bash build-windows.sh
      - name: Package macOS zip
        if: runner.os == 'macOS'
        run: |
          test -d "release/Fig Backup.app"
          ditto -c -k --sequesterRsrc --keepParent "release/Fig Backup.app" "release/Fig-Backup-macOS.zip"
      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'release/Fig Backup/Fig Backup.exe')) { throw 'Windows executable is missing' }
          Compress-Archive -Path 'release/Fig Backup' -DestinationPath 'release/Fig-Backup-Windows-x64.zip' -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: release/Fig-Backup-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
          path: dist-assets
      - name: Generate SHA256SUMS
        run: |
          cd dist-assets
          sha256sum Fig-Backup-macOS.zip Fig-Backup-Windows-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist-assets/Fig-Backup-macOS.zip
            dist-assets/Fig-Backup-Windows-x64.zip
            dist-assets/SHA256SUMS.txt
          generate_release_notes: true
