name: Windows build

on:
  push:
    branches: [windows-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm ci --no-audit --no-fund
      - name: Test
        run: |
          python -m unittest discover -s tests -q
          node --test tests/download-errors.test.js
      - name: Build interface
        run: npm run build
      - name: Package Windows app
        run: >-
          python -m PyInstaller --noconfirm --windowed --onedir
          --name "Fig Backup" --icon app-icon-windows.ico
          --distpath release --workpath .build --specpath .build
          --add-data "$env:GITHUB_WORKSPACE\dist;dist"
          --collect-all playwright --collect-all webview
          run_app.py
      - name: Create ZIP
        shell: pwsh
        run: |
          if (-not (Test-Path 'release/Fig Backup/Fig Backup.exe')) { throw 'Windows executable is missing' }
          Compress-Archive -Path 'release/Fig Backup' -DestinationPath 'release/Fig-Backup-Windows-x64.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Fig-Backup-Windows-x64
          path: release/Fig-Backup-Windows-x64.zip
          if-no-files-found: error
