name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            venv_python: .venv/bin/python
          - os: windows-2022
            venv_python: .venv/Scripts/python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m venv .venv
          ${{ matrix.venv_python }} -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm ci --no-audit --no-fund
      - name: Run tests
        run: |
          ${{ matrix.venv_python }} -m unittest discover -s tests
          npm run test:node
